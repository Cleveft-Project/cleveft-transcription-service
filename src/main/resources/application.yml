server:
  port: ${SERVER_PORT:8082}
  address: 0.0.0.0

spring:
  application:
    name: cleveft-transcription-service

  servlet:
    multipart:
      # A one-hour lecture at a mobile bitrate lands well under this.
      max-file-size: ${MAX_UPLOAD_SIZE:200MB}
      max-request-size: ${MAX_UPLOAD_SIZE:200MB}
      file-size-threshold: 2MB

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:cleveft}?currentSchema=transcription,public
    username: ${DB_USERNAME:cleveft_user}
    password: ${DB_PASSWORD:cleveft_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    # Schema is owned by cleveft-infra/init.sql.
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        default_schema: transcription
        jdbc:
          batch_size: 50
          time_zone: UTC
        order_inserts: true
    show-sql: ${JPA_SHOW_SQL:false}

cleveft:
  # Consulted before an upload is accepted, to read the student's tier and its
  # monthly recording allowance. Must point at the auth service — the default
  # is only correct when running everything on one machine outside Docker.
  auth-service:
    url: ${AUTH_SERVICE_URL:http://localhost:8084}
    timeout-ms: ${AUTH_SERVICE_TIMEOUT_MS:5000}

  stt:
    # 'gemini' is the only provider shipped today. Adding another means adding a
    # bean that implements SttProvider and switching this value.
    provider: ${STT_PROVIDER:gemini}

  gemini:
    api-key: ${GOOGLE_API_KEY:}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    stt-model: ${GEMINI_STT_MODEL:gemini-3.5-flash}
    # Deliberately a different model from stt-model: each has its own quota
    # pool, so a lecture no longer spends the same allowance twice, and a PDF
    # import is unaffected by how much audio has been transcribed today.
    notes-model: ${GEMINI_NOTES_MODEL:gemini-3.5-flash}
    embedding-model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
    # Must equal the vector(n) width in init.sql.
    dimensions: 768
    inline-limit-bytes: 14680064
    request-timeout: 10m

  audio:
    retain: ${RETAIN_AUDIO:true}
    storage-path: ${AUDIO_STORAGE_PATH:./data/audio}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.cleveft.transcriptionservice: ${LOG_LEVEL:INFO}
