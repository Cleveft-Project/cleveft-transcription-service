# Application Metadata
spring.application.name=transcription-service

# Server Configuration
server.port=${SERVER_PORT:8082}

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:cleveft}?currentSchema=transcription,public
spring.datasource.username=${DB_USERNAME:cleveft_user}
spring.datasource.password=${DB_PASSWORD:cleveft_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Engine Logic
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=transcription

# Native pgvector Object Type Mappings (Hibernate 6+)
spring.jpa.properties.hibernate.type.vector=com.pgvector.PGvector